services:
  nginx:
    image: nginx:alpine
    container_name: crm-lms-nginx
    ports:
      - "80:80"
      # - "443:443" # Uncomment when SSL is configured
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
    restart: always
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: abduvalileo/crm-lms-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-lms-api_prod
    expose:
      - "3001"
    env_file:
      - .env.production.local
    environment:
      - NODE_ENV=production
      # Override DATABASE_URL to use the local db container
      - DATABASE_URL=postgresql://leo:${POSTGRES_PASSWORD:-changeme}@db:5432/crm_prod
      # Set RUN_SEED=true ONLY on first deploy to seed initial data
      - RUN_SEED=${RUN_SEED:-false}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  # Worker is disabled for MVP. Enable when Telegram/WhatsApp notifications are needed.
  # worker:
  #   image: abduvalileo/crm-lms-api:latest
  #   command: ["node", "dist/src/worker.js"]
  #   container_name: crm-lms-worker
  #   env_file:
  #     - .env.production.local
  #   environment:
  #     - NODE_ENV=production
  #     - DATABASE_URL=postgresql://leo:${POSTGRES_PASSWORD:-changeme}@db:5432/crm_prod
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   restart: always
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512M
  #   logging: *logging

  db:
    image: postgres:16-alpine
    container_name: crm-lms-db_prod
    environment:
      POSTGRES_DB: crm_prod
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leo -d crm_prod']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    logging: *logging
    # Port exposed only on loopback for debugging; remove for full isolation.
    # ports:
    #   - "127.0.0.1:5432:5432"

volumes:
  db-data:
  uploads-data:
