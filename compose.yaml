# =============================================================================
# Production stack for a single VPS (Timeweb Cloud Server).
# Full guide: DEPLOY-TIMEWEB.md
#
# All services read secrets from ONE file: .env.production.local
# (no ${} interpolation — fewer footguns, one place to fill).
#
# Requires the front-end repo checked out as a SIBLING directory: ../front-end
#
# Deploy:
#   docker compose build                 # build api + front images
#   docker compose up -d db              # start db, then restore the dump
#   docker compose up -d                 # start the rest
# =============================================================================

services:
  nginx:
    image: nginx:alpine
    container_name: crm-lms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docker/nginx/certbot-www:/var/www/certbot
    depends_on:
      - api
      - front
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: abduvalileo/crm-lms-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      # Some VPS bridge networks have no egress during build; host net is reliable.
      network: host
    container_name: crm-lms-api_prod
    expose:
      - "3001"
    env_file:
      - .env.production.local
    environment:
      - NODE_ENV=production
      # RUN_SEED=true ONLY on the very first deploy of an EMPTY db.
      # When restoring a dump (the normal migration path), leave it false.
      - RUN_SEED=${RUN_SEED:-false}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      # node is always present in the image; wget/curl are not on node:20-bookworm-slim.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *logging

  front:
    image: abduvalileo/crm-lms-front:latest
    build:
      context: ../front-end
      dockerfile: Dockerfile
      # Some VPS bridge networks have no egress during build; host net is reliable.
      network: host
    container_name: crm-lms-front_prod
    expose:
      - "3000"
    # JWT_ACCESS_SECRET is read from the SAME .env.production.local as the api,
    # so the front middleware verifies tokens with the exact backend secret.
    env_file:
      - .env.production.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Internal URL: the front's server-side proxy/middleware reaches the api
      # over the compose network. Overrides any API_URL present in env_file.
      - API_URL=http://api:3001
      - NEXT_PUBLIC_APP_ENV=production
    depends_on:
      - api
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  # Notification worker (Telegram/WhatsApp) — disabled until reminders are needed.
  # The monthly billing cron runs in-process via @nestjs/schedule (single instance).
  # worker:
  #   image: abduvalileo/crm-lms-api:latest
  #   command: ["node", "dist/src/worker.js"]
  #   container_name: crm-lms-worker
  #   env_file:
  #     - .env.production.local
  #   environment:
  #     - NODE_ENV=production
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   restart: always
  #   logging: *logging

  db:
    # postgres:17 to match the production dump (pg_dump 17.2); pg13 cannot restore it.
    image: postgres:17-alpine
    container_name: crm-lms-db_prod
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD come from .env.production.local.
    env_file:
      - .env.production.local
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    logging: *logging

volumes:
  db-data:
  uploads-data:
