# Reverse proxy for the production stack.
#   bilimnuru.com / www.bilimnuru.com  ->  front:3000  (Next.js)
#   api.bilimnuru.com                  ->  api:3001    (NestJS, /api prefix)
#
# HTTP only for now. After certbot issues certs (see DEPLOY-TIMEWEB.md §SSL):
#   - mount /etc/letsencrypt + certbot webroot in compose.yaml (nginx service)
#   - add 443 server blocks and a 80->443 redirect.

# ── Frontend: bilimnuru.com ──────────────────────────────────────────────────
server {
    listen 80;
    server_name bilimnuru.com www.bilimnuru.com;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt HTTP-01 challenge (served once certbot webroot is mounted).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://front:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Backend API: api.bilimnuru.com ───────────────────────────────────────────
server {
    listen 80;
    server_name api.bilimnuru.com;

    # Allow larger bodies for file uploads (logo endpoint accepts up to 5 MB).
    client_max_body_size 10m;

    gzip on;
    gzip_types application/json text/plain application/javascript;

    add_header X-Content-Type-Options "nosniff" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
