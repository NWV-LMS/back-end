# Production reverse proxy — single domain.
#   bilim.denta.tw1.ru  ->  front:3000 (Next.js)
# The front proxies all /api/* to the api container internally (server-side),
# so no public api host is required. HTTPS via Let's Encrypt.

server {
    listen 80;
    server_name bilim.denta.tw1.ru;

    # Let's Encrypt HTTP-01 challenge (webroot) — issuance + renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Container healthcheck (no redirect).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bilim.denta.tw1.ru;

    ssl_certificate     /etc/letsencrypt/live/bilim.denta.tw1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilim.denta.tw1.ru/privkey.pem;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://front:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
