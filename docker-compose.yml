# Full local stack: Postgres + Backend + Frontend
# Usage:
#   docker compose up --build
#   docker compose down
#
# Frontend lives in ../front-end (sibling repo).
# Backend migrations auto-run on container start via `prisma migrate deploy`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crmpass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  back-end:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD:-crmpass}@db:5432/crm
      DATABASE_CONNECTION_LIMIT: 20
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3001:3001"
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  front-end:
    build: ../front-end
    restart: unless-stopped
    depends_on:
      back-end:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: http://back-end:3001
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports:
      - "3000:3000"

volumes:
  db_data:
